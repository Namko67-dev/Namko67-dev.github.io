<style>
  /* Промо-ролик в духе motion design: анимируется сам интерфейс — печатается запрос, мерцает статус,
     переворачивается карточка, камера наезжает на поле ввода, крутится список услуг; на фоне волна-сетка.
     Фон — шёлковые волны на WebGL-шейдере, палитра «огонь»: тёмный, красно-оранжевый, золотые блики.
     Сцена рисуется в виртуальном кадре 1600×900 (или 900×1600 на телефоне) и масштабируется под экран.
     Вид один и намеренный, от темы устройства не зависит. */
  :root {
    --bg: #0B0606; --bg-2: #160B09; --text: #FFF4EA; --muted: rgba(255, 244, 234, .64);
    --card: #FFF8F2; --ink: #1A0E0B; --ink-2: rgba(26, 14, 11, .56); --line: rgba(255, 244, 234, .16); --acc: #E8481F; --acc-ink: #FFFFFF; --panel: #B8301A; --em: #FFB07A;
    --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  html { height: 100dvh; box-sizing: border-box; }
  body { color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  *:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
  .app { position: relative; height: 100%; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* виртуальный кадр */
  .view { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; }
  .portrait .view { width: 900px; height: 1600px; }
  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  .el { position: absolute; left: 50%; top: 50%; opacity: 0; will-change: transform, opacity; }

  /* поле запроса */
  .prompt { width: 760px; padding: 22px 24px 18px; border-radius: 22px; background: rgba(18,8,6,.62); border: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 30px 80px -30px rgba(0,0,0,.7); }
  .portrait .prompt { width: 780px; }
  .pr-top { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

  .pr-text { min-height: 78px; margin-top: 14px; font-size: 30px; line-height: 1.3; font-weight: 500; color: var(--text); }
  .caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -3px; background: var(--text); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pr-bot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .spark { width: 18px; height: 18px; color: var(--em); opacity: 0; animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-family: var(--font-mono); font-size: 16px; letter-spacing: .02em; background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 35%, var(--text) 50%, var(--muted) 65%, var(--muted) 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

  .prev { width: 560px; height: 600px; }

  .dc { display: grid; grid-template-columns: 70px 1fr; gap: 16px; height: 100%; }
  .dc .srv { display: flex; flex-direction: column; gap: 12px; }

  .dc .cat { margin: 14px 0 6px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; color: var(--ink-2); }
  .dc .ch { padding: 8px 12px; border-radius: 10px; font-size: 18px; }

  .roles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

  /* цифры и финал */

      siteH: 'Coffee that wakes the city', siteBtn: 'Order now',
      dc: [['INFO', ['# rules', '# news']], ['SUPPORT', ['# open-a-ticket', '# ticket-0042']]], roles: ['Admin', 'Moderator', 'Member'],
      stats: [['5.0', 'FunPay rating'], ['34', 'reviews'], ['24/7', 'on hosting']],
      final: 'Message me — <em>I’ll build it.</em>', finalText: 'I need a Telegram bot for my shop',
      ctaTg: 'Message on Telegram', ctaPf: 'Portfolio',
      pause: 'Pause', play: 'Play',
    },
  };
  let lang = 'ru';
  try { const s = localStorage.getItem('dl-reel-lang'); if (s === 'en' || s === 'ru') lang = s; } catch (e) { /* нет хранилища */ }
  const qp = new URLSearchParams(location.search);

  function render() {
    const L = T[lang];
    document.documentElement.lang = lang;
    $$('[data-t]').forEach(n => { const v = L[n.dataset.t]; if (typeof v === 'string') n.textContent = v; });
    $('#chat').innerHTML = L.chat.map(m => `<div class="msg ${m[0]}">${m[1]}</div>`).join('');
    $('#headH').innerHTML = L.head.map(w => `<span>${w}</span>`).join(' ');
    $('#list').innerHTML = L.list.map(w => `<div class="it">${esc(w)}</div>`).join('');
    $('#prevIn').innerHTML = `
      <div class="pv" data-pv="0"><h4>${esc(L.pvBot)}</h4>${L.chat.map(m => `<div class="msg ${m[0]}" style="opacity:1;transform:none;margin-bottom:12px;${m[0] === 'me' ? 'margin-left:auto;width:max-content' : ''}">${m[1]}</div>`).join('')}</div>
      <div class="pv" data-pv="1"><h4>${esc(L.pvParser)}</h4>${L.lots.map((l, i) => `<div class="row${i === 0 ? ' hot' : ''}"><span>${esc(l[0])}</span><span><s>${esc(l[1])}</s>&nbsp; ${esc(l[2])}</span></div>`).join('')}</div>
      <div class="pv" data-pv="2"><h4>${esc(L.pvSite)}</h4><div class="site"><div class="l1">${esc(L.siteH)}</div><div class="l2"></div><span class="btn2">${esc(L.siteBtn)}</span><div class="grid3"><i></i><i></i><i></i></div></div></div>
      <div class="pv" data-pv="3"><h4>${esc(L.pvDc)}</h4><div class="dc"><div class="srv"><i></i><i></i><i></i></div><div>${L.dc.map(c => `<div class="cat">${esc(c[0])}</div>${c[1].map(ch => `<div class="ch${ch.endsWith('0042') ? ' hot' : ''}">${esc(ch)}</div>`).join('')}`).join('')}<div class="roles">${L.roles.map(r => `<span>${esc(r)}</span>`).join('')}</div></div></div></div>`;
    $('#stats').innerHTML = L.stats.map(s => `<div class="stat"><b data-v="${esc(s[0])}">${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');
    $('#finalH').innerHTML = L.final;
    $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    draw();
  }
  $$('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('dl-reel-lang', lang); } catch (e) { /* нет хранилища */ } render(); }));

  /* ---------- виртуальный кадр под экран ---------- */
  const app = $('#app'), view = $('#view'), cam = $('#cam');
  let VW = 1600, VH = 900, portrait = false;
  function layout() {
    portrait = innerWidth / innerHeight < .9;
    app.classList.toggle('portrait', portrait);
    VW = portrait ? 900 : 1600; VH = portrait ? 1600 : 900;
    const s = Math.min(innerWidth / VW, innerHeight / VH);
    view.style.transform = `scale(${s}) translate(-50%, -50%)`;
    view.style.transformOrigin = '0 0';
    sizeWave();
    draw();
  }
  addEventListener('resize', layout);

  /* ---------- фон: шёлковые волны (WebGL-шейдер) ---------- */
  const wave = $('#wave');
  const gl = wave.getContext('webgl', { antialias: false, premultipliedAlpha: false }) || wave.getContext('experimental-webgl');
  const FRAG = `
    precision highp float;
    uniform vec2 uRes; uniform float uTime; uniform float uEnergy;
    // высота «ткани»: несколько волн, которые искривляют друг друга
    float h(vec2 p, float t) {
      vec2 q = p;
      q.x += sin(p.y * 1.7 + t * .35) * .35;
      q.y += sin(p.x * 1.2 - t * .28) * .25;
      float v = sin(q.x * 2.1 + q.y * 1.3 + t * .55);
      v += .55 * sin(q.x * -1.4 + q.y * 2.6 - t * .42 + 1.7);
      v += .25 * sin((q.x + q.y) * 4.2 + t * .8);
      return v;
    }
    void main() {
      vec2 uv = gl_FragCoord.xy / uRes;
      vec2 p = (gl_FragCoord.xy - .5 * uRes) / min(uRes.x, uRes.y) * 2.3;
      p.y += .25;
      float t = uTime;
      float e = .004;
      float c = h(p, t);
      vec2 g = vec2(h(p + vec2(e, 0.), t) - c, h(p + vec2(0., e), t) - c) / e;
      vec3 n = normalize(vec3(-g * .3, 1.));
      vec3 L = normalize(vec3(-.45, .65, .62));
      float dif = clamp(dot(n, L), 0., 1.);
      float spec = pow(clamp(dot(reflect(-L, n), vec3(0., 0., 1.)), 0., 1.), 36.);
      float sheen = pow(1. - abs(n.z), 1.6);
      // палитра «огонь»: тёмный бордо → красный → оранжевый, золотые блики
      vec3 c0 = vec3(.043, .024, .024), c1 = vec3(.36, .05, .024), c2 = vec3(.85, .21, .1), c3 = vec3(1., .54, .24), hi = vec3(1., .84, .66);
      float k = clamp(dif * .9 + c * .08, 0., 1.);
      vec3 col = mix(c0, c1, smoothstep(.05, .45, k));
      col = mix(col, c2, smoothstep(.45, .8, k));
      col = mix(col, c3, smoothstep(.8, 1., k) * .8);
      col += hi * spec * (.55 + uEnergy * .8) + c3 * sheen * .25;
      // глубина: сверху темнее, по краям виньетка
      float vg = smoothstep(1.25, .2, length((uv - vec2(.5, .42)) * vec2(1.1, 1.4)));
      col *= mix(.25, 1., vg) * mix(.35, 1., smoothstep(1., .35, uv.y));
      col += uEnergy * .25 * c3;
      gl_FragColor = vec4(col, 1.);
    }`;
  let prog = null, uRes, uTime, uEnergy;
  if (gl) {
    try {
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }'));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      uRes = gl.getUniformLocation(prog, 'uRes'); uTime = gl.getUniformLocation(prog, 'uTime'); uEnergy = gl.getUniformLocation(prog, 'uEnergy');
    } catch (err) { prog = null; }
  }
  if (!prog) wave.style.background = 'radial-gradient(120% 80% at 50% 70%, #D8361A 0%, #5C0D06 45%, #0B0606 80%)';
  function sizeWave() {
    // на телефоне рисуем в пониженном разрешении: ткань мягкая, детали не нужны
    const k = Math.min(innerWidth, innerHeight) < 700 ? .5 : Math.min(1.25, window.devicePixelRatio || 1) * .75;
    wave.width = Math.max(1, Math.round(wave.clientWidth * k)); wave.height = Math.max(1, Math.round(wave.clientHeight * k));
    if (prog) gl.viewport(0, 0, wave.width, wave.height);
  }
  function drawWave(time, energy) {
    if (!prog) return;
    gl.uniform2f(uRes, wave.width, wave.height); gl.uniform1f(uTime, time); gl.uniform1f(uEnergy, energy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ---------- таймлайн ---------- */
  const TOTAL = 28;
  const el = id => document.getElementById(id);
  const show = (n, o, x = 0, y = 0, s = 1, extra = '') => { n.style.opacity = o.toFixed(3); n.style.transform = `translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)}) ${extra}`; n.style.pointerEvents = o > .5 ? 'auto' : 'none'; };
  const typed = (s, k) => { const ch = [...s]; return esc(ch.slice(0, Math.round(ch.length * clamp(k))).join('')); };

  function draw() {
    const t = state.t, L = T[lang];
    // камера: лёгкие наезды, как в ролике
    // каждый наезд живёт только внутри своей сцены
    let cs = 1, cx = 0, cy = 0;
    if (t < 8.9) cs = lerp(1, 1.06, ease(seg(t, 5.2, 8.6)));
    else if (t < 13.2) { const z = ease(seg(t, 11.0, 12.8)); cs = lerp(1, 1.7, z); cy = lerp(0, portrait ? -240 : -190, z); }
    else if (t < 19.3) cs = lerp(1, 1.04, ease(seg(t, 13.6, 19)));
    else if (t >= 22.9) cs = lerp(1, 1.04, ease(seg(t, 23, 28)));
    if (REDUCE) { cs = 1; cy = 0; }
    cam.style.transform = `translate(${cx}px,${cy}px) scale(${cs.toFixed(4)})`;

    // 1. запрос печатается, статус мерцает
    const pr = el('prompt');
    const pIn = out(seg(t, 0, .7)), pOut = ease(seg(t, 4.6, 5.4));
    show(pr, pIn * (1 - pOut), 0, (1 - pIn) * 30 - pOut * (portrait ? 420 : 300), 1 - pOut * .12);
    el('prText').innerHTML = typed(L.prompt, seg(t, .7, 2.8));
    const sendP = seg(t, 2.8, 3.1);
    el('send').style.transform = `scale(${(1 - Math.sin(sendP * Math.PI) * .18).toFixed(3)})`;
    const si = t < 3.1 ? -1 : Math.min(L.status.length - 1, Math.floor((t - 3.1) / .42));
    el('status').textContent = si < 0 ? '' : L.status[si];
    el('spark').style.opacity = si < 0 ? 0 : 1;

    // 2. белая карточка вылетает из глубины, крутится, вспыхивает и превращается в чат бота
    const fl = el('flip'), fIn = seg(t, 4.5, 6.0), fOut = ease(seg(t, 8.4, 8.8));
    const fk = out(fIn);
    show(fl, clamp(fIn * 4) * (1 - fOut), 0, (portrait ? 60 : 20) + (1 - fk) * -120, lerp(.12, 1, fk) * (1 + fOut * .1));
    el('flipIn').style.transform = REDUCE ? 'none' : `rotateY(${((1 - fk) * -540).toFixed(1)}deg) rotateX(${((1 - fk) * 28).toFixed(1)}deg)`;
    el('flipGlow').style.opacity = (seg(t, 5.7, 6.0) * (1 - seg(t, 6.05, 6.45)) + (1 - clamp(fIn * 1.6)) ).toFixed(3);
    el('flipBody').style.opacity = seg(t, 5.95, 6.2).toFixed(3);
    $$('#chat .msg').forEach((m, i) => { const k = out(seg(t, 6.2 + i * .5, 6.6 + i * .5)); m.style.opacity = k; m.style.transform = `translateY(${((1 - k) * 14).toFixed(1)}px)`; });

    // вспышка
    const fla = el('flash');
    fla.style.opacity = (seg(t, 8.6, 8.85) * (1 - seg(t, 8.95, 9.4))).toFixed(3);

    // 3. заголовок и поле вопроса, наезд камеры
    const hd = el('head'), hOut = seg(t, 13.0, 13.3);
    show(hd, (t > 9 ? 1 : 0) * (1 - hOut), 0, portrait ? -260 : -150, 1);
    $$('#headH span').forEach((w, i) => { const k = out(seg(t, 9.2 + i * .22, 9.8 + i * .22)); w.style.opacity = k; w.style.transform = `translateY(${((1 - k) * 40).toFixed(1)}px)`; w.style.filter = `blur(${((1 - k) * 8).toFixed(1)}px)`; });
    const ak = el('ask'), aIn = out(seg(t, 10.2, 10.8));
    show(ak, aIn * (1 - hOut), 0, (portrait ? 140 : 110) + (1 - aIn) * 30, 1);
    el('askText').innerHTML = typed(L.ask, seg(t, 10.8, 12.6));

    // 4. список услуг крутится, превью меняется
    const rp = el('rollPanel'), rIn = seg(t, 13.2, 13.7), rOut = seg(t, 19.0, 19.3);
    rp.style.opacity = (rIn * (1 - rOut)).toFixed(3);
    rp.style.transform = portrait ? `translateY(${((1 - out(rIn)) * -100).toFixed(1)}%)` : `translateX(${((1 - out(rIn)) * -100).toFixed(1)}%)`;
    const items = $$('#list .it'), n = items.length;
    const pos = REDUCE ? 2 : lerp(-.6, n - 1.4, ease(seg(t, 13.5, 18.8)));
    const curI = clamp(Math.round(pos), 0, n - 1);
    items.forEach((it, i) => {
      const d = i - pos, a = Math.abs(d);
      it.style.opacity = (clamp(1 - a / 3.2) * rIn * (1 - rOut)).toFixed(3);
      it.style.transform = `translate(-50%, ${(d * 86 - 32).toFixed(1)}px) scale(${(1 - Math.min(a, 3) * .12).toFixed(3)})`;
      it.classList.toggle('cur', i === curI);
    });
    const pv = el('prev'), pIn2 = out(seg(t, 13.6, 14.3));
    show(pv, pIn2 * (1 - rOut), portrait ? 0 : 330, (portrait ? 400 : 0) + (1 - pIn2) * 40, 1);
    const map = [0, 1, 2, 3, 0, 0, 3, 2];
    $$('.pv').forEach(p => p.classList.toggle('on', +p.dataset.pv === map[curI]));

    // 5. цифры
    const st = el('stats'), sIn = out(seg(t, 19.3, 19.9)), sOut = seg(t, 22.4, 22.8);
    show(st, sIn * (1 - sOut), 0, (1 - sIn) * 30, 1 - sOut * .05);
    const c = out(seg(t, 19.4, 21));
    $$('#stats b').forEach((b, i) => { const v = b.dataset.v; if (/^\d+(\.\d+)?$/.test(v)) b.textContent = (parseFloat(v) * c).toFixed(v.includes('.') ? 1 : 0); b.parentNode.style.opacity = out(seg(t, 19.3 + i * .15, 19.9 + i * .15)); });

    // 6. финал
    const fn = el('final'), fnIn = out(seg(t, 22.9, 23.6));
    show(fn, fnIn, 0, (1 - fnIn) * 30, 1);
    el('finalText').innerHTML = typed(L.finalText, seg(t, 23.9, 25.6));
    const ctaK = out(seg(t, 25.8, 26.4));
    el('cta').style.opacity = ctaK; el('cta').style.transform = `translateY(${((1 - ctaK) * 16).toFixed(1)}px)`;
  }

  /* ---------- проигрывание ---------- */
  const state = { t: 0, playing: true };
  const fq = parseFloat(qp.get('t'));
  if (!isNaN(fq)) { state.t = clamp(fq, 0, TOTAL); state.playing = false; }
  function paintPlay() {
    el('icPlay').innerHTML = state.playing ? '<path fill="currentColor" d="M6.5 4h3.5v16H6.5zM14 4h3.5v16H14z"/>' : '<path fill="currentColor" d="M7 4.5v15l13-7.5z"/>';
    el('play').setAttribute('aria-label', state.playing ? T[lang].pause : T[lang].play);
  }
  el('play').addEventListener('click', () => { if (state.t >= TOTAL) state.t = 0; state.playing = !state.playing; paintPlay(); });
  el('replay').addEventListener('click', () => { state.t = 0; state.playing = true; paintPlay(); });
  addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); el('play').click(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.playing) { state.playing = false; paintPlay(); } });

  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (state.playing) { state.t += dt; if (state.t >= TOTAL) { state.t = TOTAL; state.playing = false; paintPlay(); } draw(); }
    const energy = Math.sin(seg(state.t, 8.4, 9.8) * Math.PI) * .8 + seg(state.t, 13.2, 13.8) * .2;
    drawWave(REDUCE ? 0 : now / 1000, energy);
  }

  layout();
  render();
  paintPlay();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  requestAnimationFrame(loop);
})();
</script>

</html>
