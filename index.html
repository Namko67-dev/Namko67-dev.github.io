<script>

/* ================= Обложка: облако частиц на видеокарте ================= */
function startCloud(canvas, host) {
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: 'high-performance' });
  if (!gl) { canvas.style.display = 'none'; return () => {}; }
  const N = innerWidth < 700 ? 14000 : 26000;
  const data = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    data.set([Math.cos(th) * r, y, Math.sin(th) * r, Math.random()], i * 4);
  }
  const VS = `
attribute vec4 aP;
uniform float uTime, uIntro, uPx; uniform vec2 uTilt, uS;
varying float vA, vT, vF;
mat3 rotY(float a){ float c = cos(a), s = sin(a); return mat3(c, 0., -s, 0., 1., 0., s, 0., c); }
mat3 rotX(float a){ float c = cos(a), s = sin(a); return mat3(1., 0., 0., 0., c, s, 0., -s, c); }
void main(){
  vec3 p = aP.xyz; float rnd = aP.w; float t = uTime;
  float d = sin(p.x * 2.6 + t * .55) * sin(p.y * 2.2 - t * .4) * sin(p.z * 2.9 + t * .35);
  float d2 = sin((p.x + p.y) * 7. + t * 1.1) * sin(p.z * 6. - t * .9);
  float dust = step(.965, rnd);
  float r = mix(1. + .28 * d + .035 * d2, 1.35 + fract(rnd * 97.) * 1.7, dust);
  float k = clamp((uIntro - rnd * .35) / .65, 0., 1.); k = 1. - pow(1. - k, 3.);
  vec3 pos = mix(p * (3. + fract(rnd * 53.) * 4.), p * r, k);
  pos = rotX(.35 + uTilt.y) * rotY(t * .08 + uTilt.x) * pos;
  float w = 3.4 - pos.z;
  vec2 sp = pos.xy * (1.9 / w);
  gl_Position = vec4(sp * uS, 0., 1.);
  float front = clamp((pos.z + 1.) * .5, 0., 1.);
  gl_PointSize = uPx * (.8 + fract(rnd * 31.) * 1.3) * (3.4 / w) * mix(1., .7, dust);
  vA = k * mix(.22 + .78 * front, .45, dust); vT = d * .5 + .5; vF = front;
}`;
  const FS = `
precision mediump float;
uniform vec3 uA, uB, uC;
varying float vA, vT, vF;
void main(){
  float m = smoothstep(.5, .08, length(gl_PointCoord - .5));
  vec3 col = mix(uA, uB, vT);
  col = mix(col, uC, smoothstep(.7, 1., vF) * .55);
  float a = m * vA * 1.15;
  gl_FragColor = vec4(col * a, a);
}`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { console.warn('cloud shader failed', e); canvas.style.display = 'none'; return () => {}; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aP'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 0, 0);
  const U = {}; ['uTime', 'uIntro', 'uPx', 'uTilt', 'uS', 'uA', 'uB', 'uC'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.clearColor(0, 0, 0, 0);

  const dpr = Math.min(devicePixelRatio || 1, 2);
  const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
  const t0 = performance.now(); let raf = 0, visible = true, onScreen = true;

  function size() {
    const w = host.clientWidth, h = host.clientHeight;
    canvas.width = Math.max(2, Math.round(w * dpr)); canvas.height = Math.max(2, Math.round(h * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
    const m = Math.min(w, h) * 1.12;
    gl.uniform2f(U.uS, m / w, m / h);
    gl.uniform1f(U.uPx, 1.5 * dpr);
    if (REDUCED) draw(12, 1);
  }
  function draw(t, intro) {
    gl.uniform1f(U.uTime, t); gl.uniform1f(U.uIntro, intro); gl.uniform2f(U.uTilt, tilt.x, tilt.y);
    gl.uniform3fv(U.uA, PAL.cloud[0]); gl.uniform3fv(U.uB, PAL.cloud[1]); gl.uniform3fv(U.uC, PAL.cloud[2]);
    gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.POINTS, 0, N);
  }
  function loop() {
    const t = (performance.now() - t0) / 1000;
    tilt.x += (tilt.tx - tilt.x) * 0.04; tilt.y += (tilt.ty - tilt.y) * 0.04;
    draw(t + 4, Math.min(1, t / 2.8));
    raf = requestAnimationFrame(loop);
  }
  const go = () => { cancelAnimationFrame(raf); if (!REDUCED && visible && onScreen) raf = requestAnimationFrame(loop); };
  const onMove = e => { tilt.tx = (e.clientX / innerWidth - 0.5) * 0.5; tilt.ty = (e.clientY / innerHeight - 0.5) * 0.3; };
  const onVis = () => { visible = !document.hidden; go(); };
  const ro = new ResizeObserver(size); ro.observe(host);
  const io = new IntersectionObserver(([en]) => { onScreen = en.isIntersecting; go(); });
  io.observe(host);
  size(); if (REDUCED) draw(12, 1); else go();
  const onTheme = () => { if (REDUCED) draw(12, 1); };
  addEventListener('pointermove', onMove, { passive: true }); document.addEventListener('visibilitychange', onVis); addEventListener('themechange', onTheme);
  return () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); removeEventListener('pointermove', onMove); document.removeEventListener('visibilitychange', onVis); removeEventListener('themechange', onTheme); };
}

/* ================= Рисунки в карточках услуг (Canvas 2D, крутятся только когда карточка видна) ================= */
const COL = { a: '116,227,214', b: '156,195,255', c: '170,150,255' };   // меняется вместе с темой
const rnd = (a, b) => a + Math.random() * (b - a);

const SCENES = {
  /* Telegram: бумажный самолётик из частиц и пунктир за ним */
  plane: {
    init() {
      const tri = (a, b, c, n, fill, tone) => {
        const out = [];
        const edge = (p, q, k) => { for (let i = 0; i < k; i++) { const s = i / k; out.push({ x: p[0] + (q[0] - p[0]) * s, y: p[1] + (q[1] - p[1]) * s, ph: rnd(0, 6.28), tone }); } };
        edge(a, b, n); edge(b, c, n * 0.6 | 0); edge(c, a, n * 0.8 | 0);
        for (let i = 0; i < fill; i++) { let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
          out.push({ x: a[0] + (b[0] - a[0]) * u + (c[0] - a[0]) * v, y: a[1] + (b[1] - a[1]) * u + (c[1] - a[1]) * v, ph: rnd(0, 6.28), tone, f: 1 }); }
        return out;
      };
      return { pts: [...tri([1, 0], [-1, -0.62], [-0.28, 0.08], 90, 120, 0), ...tri([1, 0], [-0.28, 0.08], [-0.72, 0.52], 70, 70, 1)] };
    },
    draw(ctx, w, h, t, s) {
      const S = Math.min(w * 0.3, h * 0.62), cx = w * 0.58 + Math.sin(t * 0.6) * 6, cy = h * 0.46 + Math.sin(t * 0.9) * 5;
      const rot = -0.14 + Math.sin(t * 0.7) * 0.05, cr = Math.cos(rot), sr = Math.sin(rot);
      for (let i = 0; i < 46; i++) {           // пунктирный след
        const k = i / 46, x = cx - S * 0.75 - i * (w * 0.011) - ((t * 18) % (w * 0.011));
        const y = cy + S * 0.22 + Math.sin(i * 0.22 - t * 1.6) * 12 * k + k * k * 18;
        ctx.fillStyle = `rgba(${COL.b},${0.5 * (1 - k)})`; ctx.fillRect(x, y, 2, 2);
      }
      for (const p of s.pts) {
        const jx = p.x + Math.sin(t * 1.3 + p.ph) * 0.018, jy = p.y + Math.cos(t * 1.1 + p.ph) * 0.018;
        const x = cx + (jx * cr - jy * sr) * S, y = cy + (jx * sr + jy * cr) * S;
        ctx.fillStyle = `rgba(${p.tone ? COL.b : COL.a},${p.f ? 0.32 : 0.85})`; ctx.fillRect(x, y, 1.6, 1.6);
      }
    },
  },
  /* Парсеры: хаотичный поток слева складывается в ровную таблицу справа */
  stream: {

function startArt(canvas, kind) {
  const ctx = canvas.getContext('2d'); if (!ctx) return () => {};

  const draw = t => { ctx.clearRect(0, 0, w, h); ctx.globalCompositeOperation = 'lighter'; scene.draw(ctx, w, h, t, state); ctx.globalCompositeOperation = 'source-over'; };
  const loop = () => { draw((performance.now() - t0) / 1000); raf = requestAnimationFrame(loop); };
  const go = () => { cancelAnimationFrame(raf); if (onScreen && !REDUCED && !document.hidden) raf = requestAnimationFrame(loop); };
  const size = () => {
    const r = canvas.getBoundingClientRect(); w = r.width; h = r.height; if (!w || !h) return;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state = scene.init(w, h); draw(6);

}

function useCountUp(target) {
  const [v, setV] = useState(target);
  const from = useRef(target);
  useEffect(() => {
    if (REDUCED) { setV(target); from.current = target; return; }
    const start = performance.now(), a = from.current; let raf;
    const step = now => { const k = Math.min(1, (now - start) / 500), e = 1 - Math.pow(1 - k, 4); const cur = a + (target - a) * e; setV(cur); from.current = cur; if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}

    if (opts[3]) p *= 1.5;
    return Math.round(p / 50) * 50;
  }, [type, opts]);
  const shown = useCountUp(t.currency === 'RUB' ? priceRub : Math.round(priceRub / USD_RATE));
  const fmt = v => new Intl.NumberFormat(t.locale, { style: 'currency', currency: t.currency, maximumFractionDigits: 0 }).format(Math.round(v));
  const b = t.brief;
  const brief = type < 0 ? '' : [
    b.title,
    `${b.type}: ${t.types[type]}`,
    `${b.opts}: ${t.options.filter((_, i) => opts[i] && i !== 3).join(', ') || b.none}`,
    `${b.urgent}: ${opts[3] ? b.yes : b.no}`,
    `${b.price}: ${t.from} ${money(t, priceRub)}`,
    `${b.desc}: ${note.trim() || b.descPh}`,
  ].join('\n');
  const copy = async () => {
    try { await navigator.clipboard.writeText(brief); onToast(t.copied); }
    catch { const el = fallbackRef.current; if (el) { el.hidden = false; el.select(); } onToast(t.copyFail); }
  };

  return html`<section id="calc" className="gutter mx-auto wrap scroll-mt-24 py-24 sm:py-32">
    <${Heading} lines=${t.calcTitle} lead=${t.calcLead}/>
    <div className="reveal card mt-14 grid overflow-hidden lg:grid-cols-[1.3fr_1fr]">
      <div className="p-6 sm:p-10">
        <p className="eyebrow">${t.typeLabel}</p>
        <div className="mt-4 grid gap-2 sm:grid-cols-3" role="group" aria-label=${t.typeLabel}>
          ${t.types.map((label, i) => html`<button key=${i} onClick=${() => setType(i)} aria-pressed=${type === i}
            className=${`flex flex-col items-start gap-1 rounded-2xl border px-4 py-4 text-left transition-colors duration-300 ${type === i ? 'border-transparent bg-[color:var(--ink)] text-[#1d1e22]' : 'border-[color:var(--line)] bg-white/[0.02] hover:border-[color:var(--line-2)]'}`}>
            <span className="text-sm font-semibold">${label}</span>
            <span className=${`font-mono text-[11px] ${type === i ? 'text-[#1d1e22]/60' : 'text-[color:var(--muted)]'}`}>${t.from} ${money(t, TYPE_BASE[i])}</span></button>`)}
        </div>
        <p className="eyebrow mt-9">${t.optLabel}</p>
        <div className="mt-4 grid gap-2 sm:grid-cols-2">
          ${t.options.map((label, i) => html`<label key=${i} htmlFor=${`opt-${i}`}
            className=${`flex cursor-pointer items-center gap-3 rounded-2xl border px-4 py-3.5 transition-colors duration-300 ${opts[i] ? 'border-[color:var(--line-2)] bg-white/[0.05]' : 'border-[color:var(--line)] hover:border-[color:var(--line-2)]'}`}>
            <input id=${`opt-${i}`} type="checkbox" className="sr-only" checked=${opts[i]} onChange=${() => setOpts(s => s.map((v, k) => k === i ? !v : v))}/>
            <span className=${`grid h-5 w-5 shrink-0 place-items-center rounded-md border transition-colors duration-300 ${opts[i] ? 'border-transparent bg-[color:var(--accent)] text-[#1d1e22]' : 'border-white/25'}`}>${opts[i] && Icon.check}</span>
            <span className="flex-1 text-sm font-medium">${label}</span>
            <span className="font-mono text-[11px] text-[color:var(--muted)]">${OPTION_ADD[i] ? money(t, OPTION_ADD[i], true) : '×1.5'}</span>
          </label>`)}
        </div>
        <label htmlFor="note" className="eyebrow mt-9 block">${t.noteLabel}</label>
        <textarea id="note" rows="3" value=${note} onInput=${e => setNote(e.target.value)} placeholder=${t.notePh}
          className="mt-4 w-full resize-y rounded-2xl border border-[color:var(--line)] bg-black/15 px-4 py-3 text-sm text-[color:var(--ink)] placeholder:text-white/30 outline-none transition-colors focus:border-[color:var(--accent)]"></textarea>
      </div>
      <div className="flex flex-col justify-between border-t border-[color:var(--line)] bg-white/[0.02] p-6 sm:p-10 lg:border-l lg:border-t-0">
        <div>
          <p className="eyebrow">${t.estimate}</p>
          <p className="display mt-4 text-[clamp(52px,7vw,88px)] font-semibold leading-none tnum">
            ${type >= 0 ? html`<span className="block text-[0.3em] font-medium tracking-normal text-[color:var(--muted)]">${t.from}</span>${fmt(shown)}` : html`<span className="text-white/15">—</span>`}
          </p>
          <ul className="mt-8 space-y-2 border-t border-[color:var(--line)] pt-6 text-sm text-[color:var(--muted)]">
            <li className="flex justify-between gap-4"><span>${type >= 0 ? t.types[type] : t.noType}</span><span className="tnum">${type >= 0 ? money(t, TYPE_BASE[type]) : ''}</span></li>
            ${type >= 0 && t.options.map((label, i) => opts[i] && html`<li key=${i} className="flex justify-between gap-4"><span>${label}</span><span className="tnum">${OPTION_ADD[i] ? money(t, OPTION_ADD[i], true) : '×1.5'}</span></li>`)}
          </ul>
        </div>
        ${type >= 0 ? html`<div className="mt-10">
            <button onClick=${copy} className="btn inline-flex w-full items-center justify-center gap-2 rounded-full bg-[color:var(--ink)] px-6 py-4 text-sm font-semibold text-[#1d1e22]">${t.copy} ${Icon.arrow}</button>
            <textarea ref=${fallbackRef} hidden readOnly value=${brief} rows="6" aria-label=${t.copy} className="mt-3 w-full rounded-xl border border-[color:var(--line)] bg-black/30 p-3 font-mono text-xs text-white/80"></textarea>
          </div>`
          : html`<p className="mt-10 text-sm text-white/40">${t.pickType}</p>`}
      </div>
    </div>
  </section>`;
}

function Faq({ t }) {
  const [open, setOpen] = useState(0);
  return html`<section id="faq" className="gutter mx-auto max-w-4xl scroll-mt-24 py-24 sm:py-32">
    <${Heading} lines=${t.faqTitle} center/>
    <div className="mt-12 space-y-3">
      ${t.faq.map(([q, a], i) => html`<div key=${i} className="reveal card overflow-hidden" style=${{ '--d': `${i * 0.05}s` }}>
        <button className="faq flex w-full items-center justify-between gap-6 px-6 py-5 text-left sm:px-7" aria-expanded=${open === i} onClick=${() => setOpen(open === i ? -1 : i)}>
          <span className="text-[16px] font-semibold">${q}</span>
          <span className="chev grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/[0.06] text-[color:var(--muted)]">${Icon.plus}</span>
        </button>
        <div className="faq-panel"><div><p className="px-6 pb-6 text-[15px] leading-relaxed text-[color:var(--muted)] sm:px-7">${a}</p></div></div>
      </div>`)}
    </div>
  </section>`;
}

function Contact({ t }) {
  const items = [[LINKS.telegram, 'Telegram'], [LINKS.kwork, 'Kwork'], [LINKS.funpay, 'FunPay']];
  return html`<footer id="contact" className="gutter mx-auto wrap scroll-mt-24 pb-12 pt-24 sm:pt-32">
    <div className="reveal card relative overflow-hidden px-6 py-14 text-center sm:px-12 sm:py-20"
      style=${{ background: 'var(--contact-bg)' }}>
      <h2 className="reveal words display mx-auto max-w-5xl text-[clamp(36px,6vw,104px)] font-semibold leading-[1.02]" style=${{ '--d': '.2s' }}><${Words} parts=${[[t.contactTitle[0], ''], [t.contactTitle[1], 'hl text-[color:var(--muted)]']]}/></h2>
      <p className="mx-auto mt-6 max-w-[48ch] text-[15px] leading-relaxed text-[color:var(--muted)]">${t.contactText}</p>
      <a href=${LINKS.telegram} target="_blank" rel="noopener" className="btn mt-9 inline-flex items-center gap-2 rounded-full bg-[color:var(--ink)] px-7 py-4 text-sm font-semibold text-[#1d1e22]">${LINKS.telegramLabel} ${Icon.arrow}</a>
    </div>
    <div className="mt-4 grid gap-4 sm:grid-cols-3">
      ${items.map(([href, label], i) => html`<a key=${label} href=${href} target="_blank" rel="noopener" className="reveal card lift group flex items-center justify-between gap-4 px-6 py-5" style=${{ '--d': `${i * 0.06}s` }}>
        <span><span className="display block text-lg font-semibold">${label}</span><span className="mt-0.5 block text-xs text-[color:var(--muted)]">${t.linkSubs[i]}</span></span>
        <span className="text-[color:var(--muted)] transition-transform duration-500 group-hover:-translate-y-0.5 group-hover:translate-x-0.5">${Icon.ext}</span></a>`)}
    </div>
    <div className="mt-12 flex flex-wrap items-center justify-between gap-4 text-xs text-[color:var(--dim)]">
      <span>© ${new Date().getFullYear()} ${BRAND}</span>
      <span className="font-mono">Python · Telegram · Discord</span>
    </div>
  </footer>`;
}

function App() {
  const [lang, setLangState] = useState(() => {
    try { const saved = localStorage.getItem('de-lang'); if (LANGS.includes(saved)) return saved; } catch {}
    const nav = (navigator.language || 'ru').slice(0, 2);
    return LANGS.includes(nav) ? nav : 'ru';
  });
  const setLang = l => { setLangState(l); try { localStorage.setItem('de-lang', l); } catch {} };
  const [theme, setThemeState] = useState(INITIAL_THEME);
  const setTheme = m => { setThemeState(m); applyTheme(m); try { localStorage.setItem('de-theme', m); } catch {} };
  const t = T[lang];
  const [toast, setToast] = useState('');
  useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  useEffect(() => {
    if (REDUCED || !('IntersectionObserver' in window)) return;
    // показываем блок, когда он заходит в экран; прячем, когда уходит — и запоминаем, с какой стороны он ушёл,
    // чтобы при возврате он появился именно оттуда (снизу при прокрутке вниз, сверху при прокрутке вверх)
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      const el = en.target;
      if (en.isIntersecting) el.classList.add('in');
      else { el.classList.remove('in'); el.dataset.from = en.boundingClientRect.top < 0 ? 'top' : 'bottom'; }
    }), { rootMargin: '0px 0px -10% 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    document.documentElement.classList.add('js-rv');
    return () => { io.disconnect(); document.documentElement.classList.remove('js-rv'); };
  }, []);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(''), 3200); return () => clearTimeout(id); }, [toast]);

  return html`<div>
    <${Header} t=${t} lang=${lang} setLang=${setLang} theme=${theme} setTheme=${setTheme}/>
    <main>
      <${Cover} t=${t} lang=${lang}/>
      <${Proof} t=${t}/>
      <${Services} t=${t}/>
      <${Process} t=${t}/>
      <${Works} t=${t}/>
      <${Reviews} t=${t}/>
      <${Calculator} t=${t} onToast=${setToast}/>
      <${Faq} t=${t}/>
    </main>
    <${Contact} t=${t}/>
    ${toast && html`<div role="status" className="toast fixed left-1/2 z-50 rounded-full border border-[color:var(--line-2)] bg-[#2a2b31]/95 px-5 py-3 text-sm font-medium"
      style=${{ bottom: 'calc(20px + env(safe-area-inset-bottom, 0px))', maxWidth: 'calc(100vw - 32px)' }}>${toast}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</html>
