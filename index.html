  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: 'high-performance' });
  if (!gl) { canvas.style.display = 'none'; return () => {}; }
  const N = innerWidth < 700 ? 14000 : 26000;
  const data = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    data.set([Math.cos(th) * r, y, Math.sin(th) * r, Math.random()], i * 4);
  }
  const VS = `
attribute vec4 aP;
uniform float uTime, uIntro, uPx; uniform vec2 uTilt, uS;
varying float vA, vT, vF;
mat3 rotY(float a){ float c = cos(a), s = sin(a); return mat3(c, 0., -s, 0., 1., 0., s, 0., c); }
mat3 rotX(float a){ float c = cos(a), s = sin(a); return mat3(1., 0., 0., 0., c, s, 0., -s, c); }
void main(){
  vec3 p = aP.xyz; float rnd = aP.w; float t = uTime;
  float d = sin(p.x * 2.6 + t * .55) * sin(p.y * 2.2 - t * .4) * sin(p.z * 2.9 + t * .35);
  float d2 = sin((p.x + p.y) * 7. + t * 1.1) * sin(p.z * 6. - t * .9);
  float dust = step(.965, rnd);

  gl_PointSize = uPx * (.8 + fract(rnd * 31.) * 1.3) * (3.4 / w) * mix(1., .7, dust);
  vA = k * mix(.22 + .78 * front, .45, dust); vT = d * .5 + .5; vF = front;

precision mediump float;
uniform vec3 uA, uB, uC;
varying float vA, vT, vF;

    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aP'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 0, 0);

  const t0 = performance.now(); let raf = 0, visible = true, onScreen = true;

    canvas.width = Math.max(2, Math.round(w * dpr)); canvas.height = Math.max(2, Math.round(h * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
    const m = Math.min(w, h) * 1.12;
    gl.uniform2f(U.uS, m / w, m / h);
    gl.uniform1f(U.uPx, 1.5 * dpr);
    if (REDUCED) draw(12, 1);
  }
  function draw(t, intro) {
    gl.uniform1f(U.uTime, t); gl.uniform1f(U.uIntro, intro); gl.uniform2f(U.uTilt, tilt.x, tilt.y);
    gl.uniform3fv(U.uA, PAL.cloud[0]); gl.uniform3fv(U.uB, PAL.cloud[1]); gl.uniform3fv(U.uC, PAL.cloud[2]);
    gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.POINTS, 0, N);
  }
  function loop() {
    const t = (performance.now() - t0) / 1000;
    tilt.x += (tilt.tx - tilt.x) * 0.04; tilt.y += (tilt.ty - tilt.y) * 0.04;
    draw(t + 4, Math.min(1, t / 2.8));
    raf = requestAnimationFrame(loop);
  }
  const go = () => { cancelAnimationFrame(raf); if (!REDUCED && visible && onScreen) raf = requestAnimationFrame(loop); };
  const onMove = e => { tilt.tx = (e.clientX / innerWidth - 0.5) * 0.5; tilt.ty = (e.clientY / innerHeight - 0.5) * 0.3; };
  const onVis = () => { visible = !document.hidden; go(); };
  const ro = new ResizeObserver(size); ro.observe(host);
  const io = new IntersectionObserver(([en]) => { onScreen = en.isIntersecting; go(); });
  io.observe(host);
  size(); if (REDUCED) draw(12, 1); else go();
  const onTheme = () => { if (REDUCED) draw(12, 1); };
  addEventListener('pointermove', onMove, { passive: true }); document.addEventListener('visibilitychange', onVis); addEventListener('themechange', onTheme);
  return () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); removeEventListener('pointermove', onMove); document.removeEventListener('visibilitychange', onVis); removeEventListener('themechange', onTheme); };
}

/* ================= Рисунки в карточках услуг (Canvas 2D, крутятся только когда карточка видна) ================= */
const COL = { a: '116,227,214', b: '156,195,255', c: '170,150,255' };   // меняется вместе с темой
const rnd = (a, b) => a + Math.random() * (b - a);

const SCENES = {
  /* Telegram: бумажный самолётик из частиц и пунктир за ним */
  plane: {
    init() {
      const tri = (a, b, c, n, fill, tone) => {
        const out = [];
        const edge = (p, q, k) => { for (let i = 0; i < k; i++) { const s = i / k; out.push({ x: p[0] + (q[0] - p[0]) * s, y: p[1] + (q[1] - p[1]) * s, ph: rnd(0, 6.28), tone }); } };
        edge(a, b, n); edge(b, c, n * 0.6 | 0); edge(c, a, n * 0.8 | 0);
        for (let i = 0; i < fill; i++) { let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
          out.push({ x: a[0] + (b[0] - a[0]) * u + (c[0] - a[0]) * v, y: a[1] + (b[1] - a[1]) * u + (c[1] - a[1]) * v, ph: rnd(0, 6.28), tone, f: 1 }); }
        return out;
      };
      return { pts: [...tri([1, 0], [-1, -0.62], [-0.28, 0.08], 90, 120, 0), ...tri([1, 0], [-0.28, 0.08], [-0.72, 0.52], 70, 70, 1)] };
    },
    draw(ctx, w, h, t, s) {
      const S = Math.min(w * 0.3, h * 0.62), cx = w * 0.58 + Math.sin(t * 0.6) * 6, cy = h * 0.46 + Math.sin(t * 0.9) * 5;
      const rot = -0.14 + Math.sin(t * 0.7) * 0.05, cr = Math.cos(rot), sr = Math.sin(rot);
      for (let i = 0; i < 46; i++) {           // пунктирный след
        const k = i / 46, x = cx - S * 0.75 - i * (w * 0.011) - ((t * 18) % (w * 0.011));
        const y = cy + S * 0.22 + Math.sin(i * 0.22 - t * 1.6) * 12 * k + k * k * 18;
        ctx.fillStyle = `rgba(${COL.b},${0.5 * (1 - k)})`; ctx.fillRect(x, y, 2, 2);
      }
      for (const p of s.pts) {
        const jx = p.x + Math.sin(t * 1.3 + p.ph) * 0.018, jy = p.y + Math.cos(t * 1.1 + p.ph) * 0.018;
        const x = cx + (jx * cr - jy * sr) * S, y = cy + (jx * sr + jy * cr) * S;
        ctx.fillStyle = `rgba(${p.tone ? COL.b : COL.a},${p.f ? 0.32 : 0.85})`; ctx.fillRect(x, y, 1.6, 1.6);
      }
    },
  },
  /* Парсеры: хаотичный поток слева складывается в ровную таблицу справа */
  stream: {
    init(w) { const lanes = 8; return { lanes, last: 0, pts: Array.from({ length: 170 }, () => ({ lane: Math.random() * lanes | 0, x: rnd(0, w), v: rnd(34, 80), ph: rnd(0, 6.28) })) }; },
    draw(ctx, w, h, t, s) {
      const dt = s.last ? Math.min(0.05, t - s.last) : 0; s.last = t;
      const gx = w * 0.6, top = h * 0.16, bot = h * 0.84, cols = 4;
      ctx.fillStyle = `rgba(${COL.b},0.06)`;
      for (let r = 0; r <= s.lanes; r++) ctx.fillRect(gx, top + (bot - top) * (r / s.lanes) - 0.5 * (bot - top) / s.lanes, w - gx - 14, 1);
      for (let c = 0; c <= cols; c++) ctx.fillRect(gx + (w - gx - 14) * (c / cols), top - (bot - top) / s.lanes / 2, 1, bot - top + (bot - top) / s.lanes);
      for (const p of s.pts) {
        p.x += p.v * dt; if (p.x > w - 14) p.x = -4;
        const ly = top + (bot - top) * (p.lane / (s.lanes - 1)) - 0.5 * (bot - top) / s.lanes + (bot - top) / s.lanes / 2;
        if (p.x < gx) {
          const ch = 1 - p.x / gx;
          const y = ly + Math.sin(p.x * 0.03 + t * 1.4 + p.ph) * 22 * ch + Math.cos(p.x * 0.012 + p.ph * 2) * 16 * ch;
          ctx.fillStyle = `rgba(${COL.a},${0.35 + 0.5 * (1 - ch)})`; ctx.fillRect(p.x, y, 1.8, 1.8);
        } else { ctx.fillStyle = `rgba(${COL.b},0.85)`; ctx.fillRect(p.x, ly - 1, 6, 2); }
      }
    },
  },
  /* Discord: сеть узлов-участников, по связям бегут сигналы к серверу в центре */
  network: {
    init() {
      const nodes = [{ x: 0, y: 0, r: 6 }];
      for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283 + 0.3; nodes.push({ x: Math.cos(a) * 0.48, y: Math.sin(a) * 0.48, r: 3 }); }
      for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283; nodes.push({ x: Math.cos(a) * 0.92, y: Math.sin(a) * 0.92, r: 2 }); }
      nodes.forEach(n => n.ph = rnd(0, 6.28));
      const edges = [];
      for (let i = 1; i <= 6; i++) { edges.push([0, i]); edges.push([i, i % 6 + 1]); }
      for (let i = 7; i <= 16; i++) { edges.push([i, i === 16 ? 7 : i + 1]); const a = (i - 7) / 10 * 6.283;
        let best = 1, bd = 9; for (let j = 1; j <= 6; j++) { const d = Math.hypot(nodes[j].x - Math.cos(a) * .48, nodes[j].y - Math.sin(a) * .48); if (d < bd) { bd = d; best = j; } } edges.push([best, i]); }
      const pulses = Array.from({ length: 7 }, () => ({ e: edges[Math.random() * edges.length | 0], p: Math.random(), dir: Math.random() < 0.5 }));
      return { nodes, edges, pulses, last: 0 };
    },
    draw(ctx, w, h, t, s) {
      const dt = s.last ? Math.min(0.05, t - s.last) : 0; s.last = t;
      const rx = Math.min(w * 0.36, h * 0.62), ry = h * 0.36, cx = w / 2, cy = h / 2;
      const P = s.nodes.map(n => [cx + (n.x + Math.sin(t * 0.8 + n.ph) * 0.025) * rx, cy + (n.y + Math.cos(t * 0.7 + n.ph) * 0.03) * ry]);
      ctx.strokeStyle = `rgba(${COL.b},0.16)`; ctx.lineWidth = 1; ctx.beginPath();
      for (const [a, b] of s.edges) { ctx.moveTo(P[a][0], P[a][1]); ctx.lineTo(P[b][0], P[b][1]); } ctx.stroke();
      for (const q of s.pulses) {
        q.p += dt * 0.55;
        if (q.p >= 1) { const end = q.dir ? q.e[1] : q.e[0]; const next = s.edges.filter(e => e[0] === end || e[1] === end);
          q.e = next[Math.random() * next.length | 0]; q.dir = q.e[0] === end; q.p = 0; }
        const [a, b] = q.dir ? [q.e[0], q.e[1]] : [q.e[1], q.e[0]];
        const x = P[a][0] + (P[b][0] - P[a][0]) * q.p, y = P[a][1] + (P[b][1] - P[a][1]) * q.p;
        ctx.fillStyle = `rgba(${COL.a},0.18)`; ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.283); ctx.fill();
        ctx.fillStyle = `rgba(${COL.a},0.9)`; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 6.283); ctx.fill();
      }
      s.nodes.forEach((n, i) => { ctx.fillStyle = `rgba(${i ? COL.b : COL.c},${i ? 0.75 : 0.95})`; ctx.beginPath(); ctx.arc(P[i][0], P[i][1], n.r, 0, 6.283); ctx.fill(); });
      const k = (t * 0.45) % 1;
      ctx.strokeStyle = `rgba(${COL.c},${0.45 * (1 - k)})`; ctx.beginPath(); ctx.arc(P[0][0], P[0][1], 8 + k * 34, 0, 6.283); ctx.stroke();
    },
  },
  /* Моддинг: вращающееся колесо-тор из точек */
  torus: {
    init() { return { pts: Array.from({ length: 1100 }, () => [rnd(0, 6.283), rnd(0, 6.283)]) }; },
    draw(ctx, w, h, t, s) {
      const S = Math.min(w, h) * 0.34, cx = w / 2, cy = h / 2, a = t * 0.45, b = 1.0 + Math.sin(t * 0.3) * 0.25;
      const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
      for (const [u, v] of s.pts) {
        const R = 1 + 0.36 * Math.cos(v); let x = R * Math.cos(u + t * 0.3), y = R * Math.sin(u + t * 0.3), z = 0.36 * Math.sin(v);
        let y2 = y * cb - z * sb, z2 = y * sb + z * cb;
        let x3 = x * ca + z2 * sa, z3 = -x * sa + z2 * ca;
        const f = 3 / (3 - z3), front = (z3 + 1.4) / 2.8;
        ctx.fillStyle = `rgba(${front > 0.55 ? COL.a : COL.b},${0.15 + 0.7 * front})`;
        ctx.fillRect(cx + x3 * S * f, cy + y2 * S * f, 1.4 * f, 1.4 * f);
      }
    },
  },
  /* Сайты: окно браузера, в котором из частиц собирается макет страницы */
  browser: {
    init() {
      const pts = [];
      const line = (x1, y1, x2, y2, n, g, tone) => { for (let i = 0; i <= n; i++) { const s = i / n; pts.push({ x: x1 + (x2 - x1) * s, y: y1 + (y2 - y1) * s, g, tone }); } };
      const rect = (x1, y1, x2, y2, n, g, tone, fill = 0) => {
        const k = Math.round(n * (x2 - x1) / ((x2 - x1) + (y2 - y1)));
        line(x1, y1, x2, y1, k, g, tone); line(x1, y2, x2, y2, k, g, tone); line(x1, y1, x1, y2, n - k, g, tone); line(x2, y1, x2, y2, n - k, g, tone);
        for (let i = 0; i < fill; i++) pts.push({ x: rnd(x1, x2), y: rnd(y1, y2), g, tone, f: 1 });
      };
      rect(-1, -0.68, 1, 0.68, 150, 0, 1);                       // рамка окна
      line(-1, -0.5, 1, -0.5, 60, 0, 1);                         // полоса вкладок
      [-0.93, -0.87, -0.81].forEach(x => rect(x - 0.012, -0.6, x + 0.012, -0.58, 6, 0, 2, 4));
      rect(-0.62, -0.62, 0.3, -0.56, 30, 0, 1);                  // адресная строка
      line(-0.86, -0.36, -0.62, -0.36, 14, 1, 0); [0.3, 0.46, 0.62].forEach(x => line(x, -0.36, x + 0.1, -0.36, 6, 1, 1));
      line(-0.86, -0.18, 0.2, -0.18, 50, 2, 0); line(-0.86, -0.07, -0.1, -0.07, 36, 2, 0); // заголовок
      line(-0.86, 0.04, 0.0, 0.04, 30, 2, 1);
      rect(-0.86, 0.13, -0.56, 0.21, 24, 3, 2, 26);              // кнопка
      rect(0.3, -0.24, 0.86, 0.22, 60, 3, 1, 70);                // картинка
      [-0.86, -0.27, 0.32].forEach((x, i) => rect(x, 0.31, x + 0.54, 0.58, 50, 4 + i * 0.4, 0, 24)); // карточки
      pts.forEach(p => { p.sx = rnd(-1.3, 1.3); p.sy = rnd(-0.9, 0.9); p.ph = rnd(0, 6.28); });
      return { pts };
    },
    draw(ctx, w, h, t, s) {
      const S = Math.min(w * 0.4, h * 0.62), cx = w / 2, cy = h / 2 + Math.sin(t * 0.7) * 3;
      const cyc = (t % 9) / 9;                                    // сборка → пауза → рассыпание
      for (const p of s.pts) {
        const st = p.g * 0.05;
        let k = cyc < 0.86 ? Math.min(1, Math.max(0, (cyc - st) / 0.22)) : 1 - (cyc - 0.86) / 0.14;
        k = k * k * (3 - 2 * k);
        const x = p.sx + (p.x - p.sx) * k + Math.sin(t * 1.2 + p.ph) * 0.012, y = p.sy + (p.y - p.sy) * k + Math.cos(t + p.ph) * 0.012;
        const c = p.tone === 2 ? COL.c : p.tone ? COL.b : COL.a;
        ctx.fillStyle = `rgba(${c},${(p.f ? 0.22 : 0.8) * (0.35 + 0.65 * k)})`;
        ctx.fillRect(cx + x * S, cy + y * S, 1.6, 1.6);
      }
      if (cyc > 0.3 && cyc < 0.86 && (t * 1.6) % 1 < 0.55) { ctx.fillStyle = `rgba(${COL.a},0.9)`; ctx.fillRect(cx + 0.22 * S, cy - 0.2 * S, 2, 0.06 * S); } // курсор
    },
  },
};

function startArt(canvas, kind) {
  const ctx = canvas.getContext('2d'); if (!ctx) return () => {};
  const scene = SCENES[kind], dpr = Math.min(devicePixelRatio || 1, 1.5), t0 = performance.now();
  let w = 0, h = 0, state, raf = 0, onScreen = false;
  const draw = t => { ctx.clearRect(0, 0, w, h); ctx.globalCompositeOperation = 'lighter'; scene.draw(ctx, w, h, t, state); ctx.globalCompositeOperation = 'source-over'; };
  const loop = () => { draw((performance.now() - t0) / 1000); raf = requestAnimationFrame(loop); };
  const go = () => { cancelAnimationFrame(raf); if (onScreen && !REDUCED && !document.hidden) raf = requestAnimationFrame(loop); };
  const size = () => {
    const r = canvas.getBoundingClientRect(); w = r.width; h = r.height; if (!w || !h) return;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state = scene.init(w, h); draw(6);
  };
  const ro = new ResizeObserver(size); ro.observe(canvas);
  const io = new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; go(); }); io.observe(canvas);
  const onTheme = () => { if (state && (REDUCED || !onScreen)) draw(6); };
  document.addEventListener('visibilitychange', go); addEventListener('themechange', onTheme);
  return () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); document.removeEventListener('visibilitychange', go); removeEventListener('themechange', onTheme); };
}

function money(t, rub, plus) {
  const v = t.currency === 'RUB' ? rub : Math.max(1, Math.round(rub / USD_RATE));
  const s = new Intl.NumberFormat(t.locale, { style: 'currency', currency: t.currency, maximumFractionDigits: 0 }).format(v);
  return plus ? '+' + s : s;
}

function Cover({ t, lang }) {
  const host = useRef(null), canvas = useRef(null), inner = useRef(null), cloud = useRef(null);
  useEffect(() => startCloud(canvas.current, host.current), []);
  useEffect(() => {
    if (REDUCED) return;
    let ticking = false;
    const on = () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => {
        const h = host.current ? host.current.offsetHeight : innerHeight, y = Math.min(scrollY, h);
        if (inner.current) { inner.current.style.transform = `translate3d(0, ${y * 0.28}px, 0)`; inner.current.style.opacity = String(Math.max(0, 1 - y / (h * 0.7))); }
        if (cloud.current) cloud.current.style.transform = `scale(${1 + (y / h) * 0.18})`;
        ticking = false;
      });
    };
    addEventListener('scroll', on, { passive: true }); return () => removeEventListener('scroll', on);
  }, []);
  const fade = 'linear-gradient(#000 0%, #000 72%, transparent 100%)';
  return html`<section id="top" ref=${host} className="relative isolate flex min-h-[640px] items-center justify-center overflow-hidden" style=${{ height: '100svh' }}>
    <div aria-hidden="true" className="pointer-events-none absolute inset-0 -z-20" style=${{ background: 'var(--hero-bg)', WebkitMaskImage: fade, maskImage: fade }}></div>
    <div ref=${cloud} className="absolute inset-0 -z-10" style=${{ willChange: 'transform', WebkitMaskImage: fade, maskImage: fade }}>
      <canvas ref=${canvas} aria-hidden="true" className="h-full w-full"></canvas>
    </div>

    <div ref=${inner} key=${lang} className="gutter relative flex w-full max-w-5xl flex-col items-center text-center" style=${{ willChange: 'transform, opacity' }}>
      <p className="eyebrow fade" style=${{ animationDelay: '.9s' }}>${t.intro}</p>
      <h1 className="rise display mt-4 text-[clamp(76px,17vw,240px)] font-semibold leading-[0.9] tracking-[-0.055em]" aria-label=${BRAND}
        style=${{ textShadow: '0 0 60px rgba(29,30,34,.55)' }}>
        ${BRAND.split('').map((ch, i) => html`<span key=${i} aria-hidden="true" style=${{ animationDelay: `${1.0 + i * 0.06}s` }}>${ch}</span>`)}
      </h1>
      <p className="fade display mt-6 text-[clamp(20px,2.6vw,30px)] font-medium leading-snug tracking-[-0.02em]" style=${{ animationDelay: '1.6s' }}>
        ${t.sub[0]} <span className="hl-plain text-[color:var(--muted)]">${t.sub[1]}</span>
      </p>
      <div className="fade mt-10 flex flex-wrap justify-center gap-3" style=${{ animationDelay: '1.85s' }}>
        <a href="#contact" className="btn inline-flex items-center gap-2 rounded-full bg-[color:var(--ink)] px-6 py-3.5 text-sm font-semibold text-[#1d1e22]">${t.cta} ${Icon.arrow}</a>
        <a href="#works" className="btn inline-flex items-center rounded-full border border-[color:var(--line-2)] bg-white/[0.04] px-6 py-3.5 text-sm font-semibold hover:border-white/30">${t.cta2}</a>
      </div>
    </div>

    <div className="gutter absolute inset-x-0 bottom-0 mx-auto flex wrap items-end justify-between gap-6 pb-8">
      <span className="eyebrow fade hidden items-center gap-3 sm:flex" style=${{ animationDelay: '2.2s' }}><span className="cue relative block h-8 w-px overflow-hidden bg-white/15"></span>${t.scroll}</span>
      <dl className="fade flex gap-6 sm:gap-10" style=${{ animationDelay: '2.1s' }}>
        ${t.stats.map(([v, k]) => html`<div key=${k} className="text-left"><dt className="display text-lg font-semibold sm:text-xl">${v}</dt><dd className="text-[11px] text-[color:var(--muted)]">${k}</dd></div>`)}
      </dl>
    </div>
  </section>`;
}

/* окно с демо на весь экран: стрелки и Esc с клавиатуры, клик по фону закрывает */
function Lightbox({ t, at, setAt }) {
  const k = DEMOS.indexOf(at), s = SERVICES[at];
  const go = d => setAt(DEMOS[(k + d + DEMOS.length) % DEMOS.length]);
  const closeRef = useRef(null);
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') setAt(-1); else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); };
    addEventListener('keydown', onKey);
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [at]);
  useEffect(() => { closeRef.current && closeRef.current.focus(); }, []);
  const arrow = d => html`<button onClick=${() => go(d)} aria-label=${d < 0 ? '←' : '→'} className=${`lb-nav ${d < 0 ? 'p' : 'n'}`}>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d=${d < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6'}/></svg></button>`;
  return html`<div className="lb" role="dialog" aria-modal="true" aria-label=${t.services[at].title}>
    <div className="lb-bd" onClick=${() => setAt(-1)}></div>
    <figure key=${at} className="lb-fig">
      <div className="lb-media"><${Demo} s=${s} big/></div>
      <figcaption className="mt-3 flex items-center justify-between gap-4 font-mono text-[12px] uppercase tracking-wider text-[color:var(--muted)]">
        <span>${t.services[at].title} · <span className="text-[color:var(--teal)]">${t.demo}</span></span><span>${k + 1} / ${DEMOS.length}</span>
      </figcaption>
      ${arrow(-1)}${arrow(1)}
    </figure>
    <button ref=${closeRef} onClick=${() => setAt(-1)} aria-label=${t.close} className="lb-close">${Icon.plus}</button>
  </div>`;
}

function useCountUp(target) {
  const [v, setV] = useState(target);
  const from = useRef(target);
  useEffect(() => {
    if (REDUCED) { setV(target); from.current = target; return; }
    const start = performance.now(), a = from.current; let raf;
    const step = now => { const k = Math.min(1, (now - start) / 500), e = 1 - Math.pow(1 - k, 4); const cur = a + (target - a) * e; setV(cur); from.current = cur; if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}

function Calculator({ t, onToast }) {
  const [type, setType] = useState(-1);
  const [opts, setOpts] = useState([true, false, false, false]);
  const [note, setNote] = useState('');
  const fallbackRef = useRef(null);
  const priceRub = useMemo(() => {
    if (type < 0) return 0;
    let p = TYPE_BASE[type] + OPTION_ADD.reduce((s, add, i) => s + (opts[i] && add ? add : 0), 0);
    if (opts[3]) p *= 1.5;
    return Math.round(p / 50) * 50;
  }, [type, opts]);
  const shown = useCountUp(t.currency === 'RUB' ? priceRub : Math.round(priceRub / USD_RATE));
  const fmt = v => new Intl.NumberFormat(t.locale, { style: 'currency', currency: t.currency, maximumFractionDigits: 0 }).format(Math.round(v));
  const b = t.brief;
  const brief = type < 0 ? '' : [
    b.title,
    `${b.type}: ${t.types[type]}`,
    `${b.opts}: ${t.options.filter((_, i) => opts[i] && i !== 3).join(', ') || b.none}`,
    `${b.urgent}: ${opts[3] ? b.yes : b.no}`,
    `${b.price}: ${t.from} ${money(t, priceRub)}`,
    `${b.desc}: ${note.trim() || b.descPh}`,
  ].join('\n');
  const copy = async () => {
    try { await navigator.clipboard.writeText(brief); onToast(t.copied); }
    catch { const el = fallbackRef.current; if (el) { el.hidden = false; el.select(); } onToast(t.copyFail); }
  };

  return html`<section id="calc" className="gutter mx-auto wrap scroll-mt-24 py-24 sm:py-32">
    <${Heading} lines=${t.calcTitle} lead=${t.calcLead}/>
    <div className="reveal card mt-14 grid overflow-hidden lg:grid-cols-[1.3fr_1fr]">
      <div className="p-6 sm:p-10">
        <p className="eyebrow">${t.typeLabel}</p>
        <div className="mt-4 grid gap-2 sm:grid-cols-2 xl:grid-cols-4" role="group" aria-label=${t.typeLabel}>
          ${t.types.map((label, i) => html`<button key=${i} onClick=${() => setType(i)} aria-pressed=${type === i}
            className=${`flex flex-col items-start gap-1 rounded-2xl border px-4 py-4 text-left transition-colors duration-300 ${type === i ? 'border-transparent bg-[color:var(--ink)] text-[#1d1e22]' : 'border-[color:var(--line)] bg-white/[0.02] hover:border-[color:var(--line-2)]'}`}>
            <span className="text-sm font-semibold">${label}</span>
            <span className=${`font-mono text-[11px] ${type === i ? 'text-[#1d1e22]/60' : 'text-[color:var(--muted)]'}`}>${t.from} ${money(t, TYPE_BASE[i])}</span></button>`)}
        </div>
        <p className="eyebrow mt-9">${t.optLabel}</p>
        <div className="mt-4 grid gap-2 sm:grid-cols-2">
          ${t.options.map((label, i) => html`<label key=${i} htmlFor=${`opt-${i}`}
            className=${`flex cursor-pointer items-center gap-3 rounded-2xl border px-4 py-3.5 transition-colors duration-300 ${opts[i] ? 'border-[color:var(--line-2)] bg-white/[0.05]' : 'border-[color:var(--line)] hover:border-[color:var(--line-2)]'}`}>
            <input id=${`opt-${i}`} type="checkbox" className="sr-only" checked=${opts[i]} onChange=${() => setOpts(s => s.map((v, k) => k === i ? !v : v))}/>
            <span className=${`grid h-5 w-5 shrink-0 place-items-center rounded-md border transition-colors duration-300 ${opts[i] ? 'border-transparent bg-[color:var(--accent)] text-[#1d1e22]' : 'border-white/25'}`}>${opts[i] && Icon.check}</span>
            <span className="flex-1 text-sm font-medium">${label}</span>
            <span className="font-mono text-[11px] text-[color:var(--muted)]">${OPTION_ADD[i] ? money(t, OPTION_ADD[i], true) : '×1.5'}</span>
          </label>`)}
        </div>
        <label htmlFor="note" className="eyebrow mt-9 block">${t.noteLabel}</label>
        <textarea id="note" rows="3" value=${note} onInput=${e => setNote(e.target.value)} placeholder=${t.notePh}
          className="mt-4 w-full resize-y rounded-2xl border border-[color:var(--line)] bg-black/15 px-4 py-3 text-sm text-[color:var(--ink)] placeholder:text-white/30 outline-none transition-colors focus:border-[color:var(--accent)]"></textarea>
      </div>
      <div className="flex flex-col justify-between border-t border-[color:var(--line)] bg-white/[0.02] p-6 sm:p-10 lg:border-l lg:border-t-0">
        <div>
          <p className="eyebrow">${t.estimate}</p>
          <p className="display mt-4 text-[clamp(52px,7vw,88px)] font-semibold leading-none tnum">
            ${type >= 0 ? html`<span className="block text-[0.3em] font-medium tracking-normal text-[color:var(--muted)]">${t.from}</span>${fmt(shown)}` : html`<span className="text-white/15">—</span>`}
          </p>
          <ul className="mt-8 space-y-2 border-t border-[color:var(--line)] pt-6 text-sm text-[color:var(--muted)]">
            <li className="flex justify-between gap-4"><span>${type >= 0 ? t.types[type] : t.noType}</span><span className="tnum">${type >= 0 ? money(t, TYPE_BASE[type]) : ''}</span></li>
            ${type >= 0 && t.options.map((label, i) => opts[i] && html`<li key=${i} className="flex justify-between gap-4"><span>${label}</span><span className="tnum">${OPTION_ADD[i] ? money(t, OPTION_ADD[i], true) : '×1.5'}</span></li>`)}
          </ul>
        </div>
        ${type >= 0 ? html`<div className="mt-10">
            <button onClick=${copy} className="btn inline-flex w-full items-center justify-center gap-2 rounded-full bg-[color:var(--ink)] px-6 py-4 text-sm font-semibold text-[#1d1e22]">${t.copy} ${Icon.arrow}</button>
            <textarea ref=${fallbackRef} hidden readOnly value=${brief} rows="6" aria-label=${t.copy} className="mt-3 w-full rounded-xl border border-[color:var(--line)] bg-black/30 p-3 font-mono text-xs text-white/80"></textarea>
          </div>`
          : html`<p className="mt-10 text-sm text-white/40">${t.pickType}</p>`}
      </div>
    </div>
  </section>`;
}

function App() {
  const [lang, setLangState] = useState(() => {
    try { const saved = localStorage.getItem('de-lang'); if (LANGS.includes(saved)) return saved; } catch {}
    const nav = (navigator.language || 'ru').slice(0, 2);
    return LANGS.includes(nav) ? nav : 'ru';
  });
  const setLang = l => { setLangState(l); try { localStorage.setItem('de-lang', l); } catch {} };
  const [theme, setThemeState] = useState(INITIAL_THEME);
  const setTheme = m => { setThemeState(m); applyTheme(m); try { localStorage.setItem('de-theme', m); } catch {} };
  const t = T[lang];
  const [toast, setToast] = useState('');
  useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  useEffect(() => {
    if (REDUCED || !('IntersectionObserver' in window)) return;
    // показываем блок, когда он заходит в экран; прячем, когда уходит — и запоминаем, с какой стороны он ушёл,
    // чтобы при возврате он появился именно оттуда (снизу при прокрутке вниз, сверху при прокрутке вверх)
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      const el = en.target;
      if (en.isIntersecting) el.classList.add('in');
      else { el.classList.remove('in'); el.dataset.from = en.boundingClientRect.top < 0 ? 'top' : 'bottom'; }
    }), { rootMargin: '0px 0px -10% 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    document.documentElement.classList.add('js-rv');
    return () => { io.disconnect(); document.documentElement.classList.remove('js-rv'); };
  }, []);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(''), 3200); return () => clearTimeout(id); }, [toast]);

  return html`<div>
    <${Header} t=${t} lang=${lang} setLang=${setLang} theme=${theme} setTheme=${setTheme}/>
    <main>
      <${Cover} t=${t} lang=${lang}/>
      <${Proof} t=${t}/>
      <${Services} t=${t}/>
      <${Process} t=${t}/>
      <${Works} t=${t}/>
      <${Reviews} t=${t}/>
      <${Calculator} t=${t} onToast=${setToast}/>
      <${Faq} t=${t}/>
    </main>
    <${Contact} t=${t}/>
    ${toast && html`<div role="status" className="toast fixed left-1/2 z-50 rounded-full border border-[color:var(--line-2)] bg-[#2a2b31]/95 px-5 py-3 text-sm font-medium"
      style=${{ bottom: 'calc(20px + env(safe-area-inset-bottom, 0px))', maxWidth: 'calc(100vw - 32px)' }}>${toast}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
