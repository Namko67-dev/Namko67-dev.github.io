<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="DanivaL: промо-ролик на 30 секунд. Сайты, Telegram-боты, веб-приложения и автоматизация.">
<meta name="theme-color" content="#0B0606">
<meta property="og:title" content="DanivaL — цифровые решения для бизнеса">
<meta property="og:description" content="Сайты, Telegram-боты и Mini Apps, веб-приложения и автоматизация. Промо-ролик на 30 секунд.">
<meta property="og:type" content="website">
<!-- защита: скрипты только со страницы, без внешних запросов, форм и плагинов -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0606'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%23E2381C'%3ED%3C/text%3E%3C/svg%3E">
<title>DanivaL Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Промо-ролик DanivaL, 30 секунд, 6 сцен:
     логотип → сайты (светлая сцена) → Telegram-боты и Mini Apps → веб-приложения (светлая) → реальные проекты → призыв.
     Тёмные сцены идут на огненном «шёлке» (WebGL-шейдер), светлые — на бумажном слое, который въезжает шторкой.
     Красный — только акцент: логотип, главные кнопки, выбранные элементы.
     Кадр виртуальный: 1600×900 (или 900×1600 на телефоне), масштабируется под экран.
     Музыка синтезируется в браузере (Web Audio), своя, без чужих треков; включается кнопкой «Звук». */
  :root {
    --black: #0A0606; --text: #FFF4EA; --muted: rgba(255, 244, 234, .66); --line: rgba(255, 244, 234, .18);
    --paper: #F3EFEB; --paper-2: #E8E2DC; --ink: #170D0B; --ink-2: rgba(23, 13, 11, .58); --ink-line: rgba(23, 13, 11, .12);
    --red: #E2381C; --red-deep: #8E1A0B; --ember: #FFB07A; --white: #FFFFFF;
    --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--black); }
  html { height: 100dvh; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: border-box; }
  body { color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  *:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .app { position: relative; height: 100%; overflow: hidden; background: var(--black); user-select: none; -webkit-user-select: none; }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .paper { position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 20%, #FAF7F4 0%, var(--paper) 55%, var(--paper-2) 100%); clip-path: inset(100% 0 0 0); will-change: clip-path; }

  /* виртуальный кадр */
  .view { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; }
  .portrait .view { width: 900px; height: 1600px; }
  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  .el { position: absolute; left: 50%; top: 50%; opacity: 0; will-change: transform, opacity; }
  .serif { font-family: var(--font-serif); font-weight: 500; letter-spacing: -.02em; }
  .w { display: inline-block; }

  /* искры */
  .embers { position: absolute; inset: 0; pointer-events: none; }
  .embers i { position: absolute; left: 0; top: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 10px 2px rgba(255, 140, 70, .55); opacity: 0; }

  /* 1. логотип */
  .logo { text-align: center; width: 1400px; }
  .portrait .logo { width: 860px; }
  .lg-word { display: flex; justify-content: center; align-items: baseline; gap: 28px; white-space: nowrap; }
  .lg-name { font-size: 200px; line-height: .95; }
  .portrait .lg-name { font-size: 150px; }
  .lg-dev { font-family: var(--font-sans); font-weight: 600; font-size: 54px; letter-spacing: .32em; color: var(--muted); }
  .portrait .lg-dev { font-size: 44px; }
  .lg-word .c { display: inline-block; }
  .lg-line { width: 420px; height: 3px; margin: 34px auto 0; background: var(--red); transform-origin: 50% 50%; transform: scaleX(0); border-radius: 2px; }
  .lg-slogan { margin: 30px 0 0; font-size: 34px; font-weight: 500; color: var(--text); }
  .portrait .lg-slogan { font-size: 40px; line-height: 1.3; }

  /* заголовки сцен */
  .sh { width: 560px; }
  .sh h2 { margin: 0; font-size: 72px; line-height: 1.02; }
  .sh p { margin: 24px 0 0; max-width: 500px; font-size: 26px; line-height: 1.45; color: var(--muted); }
  .price { display: inline-flex; margin-top: 26px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line); font-size: 22px; font-weight: 700; white-space: nowrap; }
  .portrait .price { font-size: 28px; padding: 12px 24px; }
  .sh.on-paper .price { border-color: var(--ink); }
  .sh.on-paper { color: var(--ink); }
  .sh.on-paper p { color: var(--ink-2); }
  .portrait .sh { width: 820px; text-align: center; }
  .portrait .sh h2 { font-size: 86px; }
  .portrait .sh p { max-width: none; font-size: 30px; }
  .portrait .sh.center h2 { font-size: 72px; }
  .sh.center { width: 1200px; text-align: center; }
  .sh.center p { max-width: none; }
  .portrait .sh.center { width: 820px; }

  /* окно браузера (сайты, панель) */
  .win { border-radius: 22px; background: var(--white); color: var(--ink); box-shadow: 0 40px 90px -30px rgba(60, 20, 10, .35), 0 0 0 1px var(--ink-line); overflow: hidden; }
  .win-bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--ink-line); background: #FBF9F7; }
  .win-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--ink-line); }
  .win-bar span { flex: 1; margin: 0 40px 0 14px; height: 26px; border-radius: 8px; background: rgba(23, 13, 11, .05); font-size: 13px; line-height: 26px; text-align: center; color: var(--ink-2); white-space: nowrap; overflow: hidden; }

  /* 2. сайт-магазин: адаптив через container queries */
  .site { width: 760px; height: 560px; container-type: inline-size; }
  .site-in { position: relative; height: calc(100% - 44px); padding: 0 26px; overflow: hidden; }
  .s-nav { display: flex; align-items: center; gap: 22px; height: 64px; font-size: 15px; font-weight: 600; }
  .s-nav b { font-family: var(--font-serif); font-size: 24px; font-weight: 600; margin-right: auto; }
  .s-nav .lnk { color: var(--ink-2); }
  .s-cart { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: rgba(23, 13, 11, .06); }
  .s-badge { position: absolute; right: -6px; top: -6px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; transform: scale(0); }
  .s-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: center; padding: 6px 0 22px; }
  .s-hero h3 { margin: 0; font-family: var(--font-serif); font-weight: 500; font-size: 40px; line-height: 1.04; letter-spacing: -.02em; }
  .s-hero .btn2 { display: inline-block; margin-top: 16px; padding: 11px 20px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 600; }
  .s-img { height: 150px; border-radius: 18px; background: radial-gradient(60% 70% at 70% 40%, #C98B5A 0%, #6B3A22 55%, #2A150C 100%); position: relative; overflow: hidden; }
  .s-img::after { content: ""; position: absolute; left: 22%; top: 26%; width: 70px; height: 92px; border-radius: 50%; background: rgba(255, 255, 255, .14); transform: rotate(-24deg); }
  .s-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .s-card { border-radius: 16px; border: 1px solid var(--ink-line); padding: 10px; }
  .s-card .ph { height: 92px; border-radius: 11px; }
  .s-card:nth-child(1) .ph { background: linear-gradient(140deg, #3B2418, #9A6B48); }
  .s-card:nth-child(2) .ph { background: linear-gradient(140deg, #2E2B27, #8D877E); }
  .s-card:nth-child(3) .ph { background: linear-gradient(140deg, #5A3A1F, #D2A877); }
  .s-card b { display: block; margin-top: 10px; font-size: 16px; }
  .s-card .pr { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; white-space: nowrap; font-size: 15px; color: var(--ink-2); }
  .s-add { padding: 6px 11px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .s-add.done { background: var(--red); }
  @container (max-width: 520px) {
    .s-nav .lnk { display: none; }
    .s-hero { grid-template-columns: 1fr; gap: 14px; }
    .s-hero h3 { font-size: 32px; }
    .s-img { order: -1; height: 130px; }
    .s-grid { grid-template-columns: repeat(2, 1fr); }
    .s-card:nth-child(3) { display: none; }
    .s-card .pr { flex-direction: column; align-items: flex-start; }
  }
  .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; pointer-events: none; z-index: 3; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .3)); }
  .tag { padding: 12px 22px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 20px; font-weight: 600; white-space: nowrap; }

  /* 3. чат бота и Mini App */
  .flip { width: 460px; height: 620px; perspective: 1400px; }
  .portrait .flip { width: 400px; height: 680px; }
  .flip-in { position: absolute; inset: 0; border-radius: 30px; background: #FFF8F2; color: var(--ink); box-shadow: 0 50px 120px -40px rgba(0, 0, 0, .85); overflow: hidden; transform-style: preserve-3d; }
  .flip-in .glow { position: absolute; inset: 0; z-index: 2; background: #fff; opacity: 0; pointer-events: none; }
  .tg-head { display: flex; align-items: center; gap: 14px; padding: 20px 24px; border-bottom: 1px solid var(--ink-line); }
  .tg-ava { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: #FFF8F2; font-weight: 700; font-size: 18px; }
  .tg-head b { display: block; font-size: 20px; }
  .tg-head small { color: var(--ink-2); font-size: 15px; }
  .tg-body { display: flex; flex-direction: column; gap: 12px; padding: 22px 24px; }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 20px; font-size: 19px; line-height: 1.35; opacity: 0; }
  .msg.me { align-self: flex-end; background: var(--ink); color: #FFF8F2; border-bottom-right-radius: 6px; }
  .msg.bot { align-self: flex-start; background: rgba(23, 13, 11, .06); border-bottom-left-radius: 6px; }
  .msg.bot b { display: block; }
  .msg .pic { height: 120px; margin: -4px -8px 10px; border-radius: 14px; background: linear-gradient(135deg, #3A2A26, #8E1A0B); }
  .msg .bt { display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: #FFF8F2; font-size: 15px; font-weight: 700; }
  .mini { width: 340px; height: 620px; border-radius: 30px; background: #fff; color: var(--ink); box-shadow: 0 50px 120px -40px rgba(0, 0, 0, .85); overflow: hidden; display: flex; flex-direction: column; }
  .portrait .mini { width: 360px; height: 680px; }
  .mini-head { padding: 22px 22px 6px; }
  .mini-head small { display: block; font-size: 14px; color: var(--ink-2); }
  .mini-head b { font-family: var(--font-serif); font-weight: 500; font-size: 32px; }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 22px; }
  .mini-grid div { border-radius: 16px; padding: 8px; border: 2px solid transparent; background: rgba(23, 13, 11, .04); }
  .mini-grid div.sel { border-color: var(--red); }
  .mini-grid i { display: block; height: 96px; border-radius: 11px; }
  .mini-grid div:nth-child(1) i { background: linear-gradient(135deg, #3A2A26, #8E1A0B); }
  .mini-grid div:nth-child(2) i { background: linear-gradient(135deg, #3B3A38, #A8A39C); }
  .mini-grid div:nth-child(3) i { background: linear-gradient(135deg, #1F2A33, #6D8597); }
  .mini-grid div:nth-child(4) i { background: linear-gradient(135deg, #4A3B22, #C9A86A); }
  .mini-grid b { display: block; margin-top: 8px; font-size: 14px; line-height: 1.25; }
  .mini-grid span { font-size: 14px; color: var(--ink-2); }
  .mini-pay { position: relative; margin: auto 18px 18px; height: 60px; border-radius: 16px; background: var(--red); color: #fff; font-size: 19px; font-weight: 700; display: grid; place-items: center; overflow: hidden; }
  .mini-pay.paid { background: var(--ink); }
  .mini-pay .rip { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px; border-radius: 50%; background: rgba(255, 255, 255, .35); transform: scale(0); opacity: 0; }

  /* 4. панель управления */
  .dash { width: 840px; height: 580px; }
  .portrait .dash { width: 820px; height: 720px; }
  .dash-in { display: grid; grid-template-columns: 168px 1fr; height: calc(100% - 44px); }
  .d-side { padding: 20px 14px; border-right: 1px solid var(--ink-line); background: #FBF9F7; }
  .d-side .lg { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); margin: 0 0 20px 6px; }
  .d-side div { padding: 9px 10px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .d-side div.on { background: rgba(23, 13, 11, .07); color: var(--ink); }
  .d-main { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; min-width: 0; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpi { padding: 14px 16px; border-radius: 14px; border: 1px solid var(--ink-line); }
  .kpi small { display: block; font-size: 13px; color: var(--ink-2); }
  .kpi b { display: block; margin-top: 4px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chart { position: relative; flex: 1; min-height: 120px; border-radius: 14px; border: 1px solid var(--ink-line); padding: 12px 16px; }
  .chart small { font-size: 13px; color: var(--ink-2); }
  .chart svg { position: absolute; left: 16px; right: 16px; bottom: 12px; width: calc(100% - 32px); height: calc(100% - 44px); overflow: visible; }
  .tbl { border-radius: 14px; border: 1px solid var(--ink-line); padding: 6px 0; }
  .tbl .r { display: grid; grid-template-columns: 1.4fr 1fr 1fr; align-items: center; padding: 9px 16px; font-size: 15px; }
  .tbl .r.h { font-size: 13px; color: var(--ink-2); }
  .chip { justify-self: start; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(23, 13, 11, .06); color: var(--ink-2); }
  .chip.ok { background: var(--ink); color: #fff; }
  .flow { display: flex; flex-direction: column; gap: 0; width: 520px; }
  .portrait .flow { flex-direction: row; width: 820px; align-items: center; }
  .node { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 16px; border: 1px solid var(--ink-line); background: rgba(255, 255, 255, .6); color: var(--ink); font-size: 20px; font-weight: 600; transition: none; }
  .portrait .node { flex: 1; flex-direction: column; text-align: center; gap: 10px; padding: 18px 12px; font-size: 22px; }
  .node i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-line); }
  .node.on { border-color: var(--ink); background: #fff; }
  .node.on i { background: var(--red); box-shadow: 0 0 0 5px rgba(226, 56, 28, .18); }
  .link { width: 2px; height: 22px; margin-left: 25px; background: var(--ink-line); position: relative; overflow: hidden; }
  .portrait .link { width: 30px; height: 2px; margin: 0; }
  .link b { position: absolute; inset: 0; background: var(--ink); transform-origin: 0 0; transform: scaleY(0); }
  .portrait .link b { transform: scaleX(0); }

  /* 5. реальные проекты */
  .shot { width: 420px; }
  .portrait .shot { width: 400px; }
  .shot img { display: block; width: 100%; aspect-ratio: 960 / 660; object-fit: cover; border-radius: 18px; box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .9), 0 0 0 1px var(--line); background: #1a1210; }
  .shot figcaption { margin-top: 16px; font-size: 22px; font-weight: 600; }
  .shot figcaption b { display: block; }
  .shot figcaption span { display: block; margin-top: 4px; font-size: 18px; font-weight: 500; color: var(--muted); }
  .portrait .shot figcaption span { font-size: 21px; }
  .portrait .shot figcaption { font-size: 24px; }
  .trust { display: flex; align-items: center; gap: 56px; width: 1300px; justify-content: center; }
  .portrait .trust { flex-direction: column; gap: 30px; width: 820px; }
  .tr-num { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
  .tr-num b { font-family: var(--font-serif); font-weight: 500; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
  .tr-num span { font-size: 20px; color: var(--muted); }
  .portrait .tr-num span { font-size: 26px; }
  .tr-q { max-width: 470px; padding-left: 26px; border-left: 2px solid var(--red); font-size: 21px; line-height: 1.45; }
  .portrait .tr-q { max-width: 760px; font-size: 26px; }
  .tr-q small { display: block; margin-top: 8px; font-size: 16px; color: var(--muted); }
  .portrait .tr-q small { font-size: 20px; }

  /* 6. финал */
  .final { width: 1240px; text-align: center; }
  .portrait .final { width: 820px; }
  .fin-logo { font-size: 46px; white-space: nowrap; }
  .fin-logo span { font-family: var(--font-sans); font-weight: 600; font-size: 20px; letter-spacing: .32em; color: var(--muted); margin-left: 14px; vertical-align: 6px; }
  .final h2 { margin: 30px 0 0; font-size: 88px; line-height: 1.02; }
  .final h2 { max-width: 920px; margin-left: auto; margin-right: auto; }
  .portrait .final h2 { font-size: 92px; }
  .terms { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
  .terms span { padding: 9px 18px; border-radius: 999px; background: rgba(255, 244, 234, .09); border: 1px solid var(--line); font-size: 20px; font-weight: 600; }
  .portrait .terms span { font-size: 26px; padding: 12px 22px; }
  .cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 42px; }
  .btn { display: inline-flex; align-items: center; height: 68px; padding: 0 34px; border-radius: 999px; font-size: 21px; font-weight: 700; text-decoration: none; transition: transform .15s, background-color .15s; }
  .portrait .btn { height: 100px; padding: 0 48px; font-size: 32px; }
  .btn:active { transform: scale(.97); }
  .btn-acc { background: var(--red); color: #fff; }
  .btn-acc:hover { background: #F04A2C; }
  .btn-line { border: 1px solid var(--line); color: var(--text); }
  .btn-line:hover { background: rgba(255, 255, 255, .06); }
  .contact { margin-top: 24px; font-size: 20px; color: var(--muted); }
  .portrait .contact { font-size: 28px; }

  /* верх и управление (вне виртуального кадра) */
  .top { position: absolute; z-index: 10; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; height: 58px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); transition: color .3s; }
  .brand { font-family: var(--font-serif); font-size: 20px; font-weight: 600; white-space: nowrap; }
  .brand span { font-family: var(--font-sans); font-size: 12px; letter-spacing: .3em; margin-left: 6px; opacity: .7; }
  .pill { display: flex; padding: 3px; border-radius: 999px; border: 1px solid currentColor; border-color: color-mix(in srgb, currentColor 22%, transparent); }
  .pill button { min-width: 38px; height: 30px; padding: 0 9px; border: 0; border-radius: 999px; background: transparent; font-size: 12px; font-weight: 700; color: inherit; opacity: .7; }
  .pill button[aria-pressed="true"] { background: currentColor; opacity: 1; }
  .pill button[aria-pressed="true"] span { color: var(--black); }

  function noiseHit(when, type, freq, lvl, a, d) {
    const ctx = SND.ctx, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = SND.noise; f.type = type; f.frequency.value = freq; env(g, when, lvl, a, d);
    s.connect(f); f.connect(g); g.connect(SND.bus); s.start(when); s.stop(when + a + d + .05); return f;
  }
  const hat = (when, lvl) => noiseHit(when, 'highpass', 8000, lvl, .002, .05);
  function boom(when, lvl) { kick(when, lvl); const ctx = SND.ctx, o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(60, when); o.frequency.exponentialRampToValueAtTime(30, when + .9); env(g, when, lvl * .6, .01, 1.1); o.connect(g); g.connect(SND.bus); o.start(when); o.stop(when + 1.2); noiseHit(when, 'lowpass', 900, lvl * .25, .005, .5); }
  function riser(when, dur) {
    const ctx = SND.ctx, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = SND.noise; s.loop = true; f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(400, when); f.frequency.exponentialRampToValueAtTime(5000, when + dur);
    g.gain.setValueAtTime(.0001, when); g.gain.exponentialRampToValueAtTime(.09, when + dur - .02); g.gain.linearRampToValueAtTime(.0001, when + dur + .03);
    s.connect(f); f.connect(g); g.connect(SND.bus); s.start(when); s.stop(when + dur + .05);
  }
  function bell(fr, when, lvl) {
    const ctx = SND.ctx, g = ctx.createGain(); env(g, when, lvl, .005, 1.4); g.connect(SND.bus);
    [[1, 1], [2.01, .35], [3.0, .12]].forEach(([m, v]) => { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sine'; o.frequency.value = fr * m; og.gain.value = v; o.connect(og); og.connect(g); o.start(when); o.stop(when + 1.5); });
  }
  function tick(when) { const ctx = SND.ctx, o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = 1800; env(g, when, .035, .001, .03); o.connect(g); g.connect(SND.bus); o.start(when); o.stop(when + .05); }

  function setSound(on) {
    if (on && !audioInit()) return;
    SND.on = on;
    el('snd').setAttribute('aria-pressed', on);
    if (on) { SND.ctx.resume(); if (state.playing) resync(); }
    else if (SND.ctx) { if (SND.bus) { const now = SND.ctx.currentTime; SND.bus.gain.cancelScheduledValues(now); SND.bus.gain.setTargetAtTime(0, now, .05); } SND.bus = null; }
  }
  el('snd').addEventListener('click', () => setSound(!SND.on));

  /* ---------- проигрывание ---------- */
  const state = { t: 0, playing: true };
  const fq = parseFloat(qp.get('t'));
  if (!isNaN(fq)) { state.t = clamp(fq, 0, TOTAL); state.playing = false; }
  function paintPlay() {
    el('icPlay').innerHTML = state.playing ? '<path fill="currentColor" d="M6.5 4h3.5v16H6.5zM14 4h3.5v16H14z"/>' : '<path fill="currentColor" d="M7 4.5v15l13-7.5z"/>';
    el('play').setAttribute('aria-label', state.playing ? T[lang].pause : T[lang].play);
  }
  function setPlaying(p) {
    state.playing = p; paintPlay();
    if (SND.on && SND.ctx) { if (p) { SND.ctx.resume(); resync(); } else SND.ctx.suspend(); }
  }
  el('play').addEventListener('click', () => { if (state.t >= TOTAL) state.t = 0; setPlaying(!state.playing); });
  el('replay').addEventListener('click', () => { state.t = 0; setPlaying(true); draw(); });
  addEventListener('keydown', e => { if (e.key === ' ' && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLAnchorElement)) { e.preventDefault(); el('play').click(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.playing) setPlaying(false); });

  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (state.playing) { state.t += dt; if (state.t >= TOTAL) { state.t = TOTAL; setPlaying(false); } schedule(); draw(); }
    const t = state.t;
    const energy = CUTS.reduce((s, c) => s + bump(t, c, .6) * .7, 0) + bump(t, 1.0, .5) * .4 + seg(t, 26, 28) * .3;
    const covered = t > 3.25 && t < 8.55 || t > 15.25 && t < 20.55;   // фон закрыт бумагой — не рисуем
    if (!covered) drawWave(REDUCE ? 0 : now / 1000, energy, lerp(.75, 1, seg(t, 0, 1.5)));
  }

  layout();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  requestAnimationFrame(loop);
})();
</script>
